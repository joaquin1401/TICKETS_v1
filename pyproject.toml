[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip = ["venv", ".venv", "migrations"]
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "migrations"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions (C4) + mccabe complexity (C901)
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black

    # Deuda conocida, preexistente al momento de habilitar el gate de lint en CI
    # (ver commit "formatear todo el codigo..."). No son bugs: requieren criterio
    # o refactor, no son mecanicos. Sacar de esta lista a medida que se atienden.
    "C901",  # complejidad ciclomatica alta en algunas funciones de services.py/
             # views/ (crear_ticket_con_reglas y afines) - requiere refactor real,
             # no un fix de una linea.
]

[tool.ruff.lint.per-file-ignores]
# reservas/views/__init__.py re-exporta TODAS las vistas de cada submodulo con
# `from .x import *` a proposito: es lo que le permite a urls.py seguir haciendo
# `from . import views` y referenciar `views.nombre_de_vista` sin saber en que
# submodulo vive cada una. Pasar a imports explicitos significaria mantener a
# mano una lista gigante que se rompe en silencio cada vez que alguien agrega
# una vista nueva y se olvida de sumarla aca - peor tradeoff que el wildcard.
"reservas/views/__init__.py" = ["F403"]

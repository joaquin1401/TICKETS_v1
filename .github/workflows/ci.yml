name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    # No depende de Postgres, corre primero para dar feedback rápido antes
    # de levantar el servicio de BD y correr la suite completa.
    - name: Lint (black + ruff)
      run: |
        black --check reservas config manage.py
        ruff check reservas config manage.py

    - name: Run Tests
      env:
        # settings.py ahora default a DJANGO_DEBUG=False cuando la env var no
        # está seteada (antes era True) - fail-closed si un deploy real se
        # olvida de configurarla. Este runner no tiene el .env local (está en
        # .gitignore), así que sin esto DEBUG=False + sin DJANGO_SECRET_KEY
        # dispara el ImproperlyConfigured de settings.py antes de correr un
        # solo test. Mismo dummy key que usan los steps de abajo.
        DJANGO_SECRET_KEY: 'ci-dummy-key-not-real-8f3k2n9x7q1w5e6r4t8y0u2i3o5p7a9s1d3f-not-a-secret'
        DJANGO_DEBUG: 'False'
        # SECURE_SSL_REDIRECT default a str(not DEBUG): con DEBUG=False acá
        # arriba, sin esto quedaba en True y SecurityMiddleware redirigía
        # (301) cada request de self.client a https antes de llegar a la
        # vista - el test client no marca sus requests como "secure", así
        # que rompía prácticamente cualquier test que chequeara un
        # status_code o siguiera un redirect (302 esperado, 301 real).
        SECURE_SSL_REDIRECT: 'False'
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        python manage.py test

    - name: Run Build (Collect Static)
      run: |
        python manage.py collectstatic --noinput
      env:
        # settings.py lee DJANGO_SECRET_KEY / DJANGO_DEBUG, no SECRET_KEY / DEBUG:
        # con los nombres viejos estas variables no se aplicaban.
        # DJANGO_DEBUG=False a propósito: es lo que hace que STORAGES use
        # CompressedManifestStaticFilesStorage (el storage real de producción)
        # en vez del storage simple. Con DEBUG=True este paso no estaría
        # probando nada — collectstatic pasaría igual aunque el manifest
        # estuviera roto.
        # No es una clave real: solo tiene que ser suficientemente larga/random
        # para no disparar security.W009 (menos de 50 caracteres o poca
        # variedad) al correr check --deploy.
        DJANGO_SECRET_KEY: 'ci-dummy-key-not-real-8f3k2n9x7q1w5e6r4t8y0u2i3o5p7a9s1d3f-not-a-secret'
        DJANGO_DEBUG: 'False'
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432

    # Simula un entorno de producción "correctamente configurado" y falla si
    # check --deploy encuentra un WARNING o algo peor (por defecto solo falla
    # en ERROR). Las variables de abajo son justamente las que check --deploy
    # pide: sin ellas, este paso fallaría por config incompleta, no por un
    # bug real - reflejan lo mínimo que hay que setear en el deploy real.
    - name: Check Deploy Readiness
      run: |
        python manage.py check --deploy --fail-level WARNING
      env:
        DJANGO_SECRET_KEY: 'ci-dummy-key-not-real-8f3k2n9x7q1w5e6r4t8y0u2i3o5p7a9s1d3f-not-a-secret'
        DJANGO_DEBUG: 'False'
        ALLOWED_HOSTS: 'ci-check.example.com'
        CSRF_COOKIE_SECURE: 'True'
        SESSION_COOKIE_SECURE: 'True'
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
